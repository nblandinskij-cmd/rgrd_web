<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtRegardFinance – Админ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { padding: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔧 Панель администратора</h1>
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">📋 Активные заявки</div>
                <div class="card-body">
                    {% if pending %}
                    <ul class="list-group">
                        {% for p in pending %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong>{{ p.master }}</strong> – {{ p.amount }} руб.<br>
                                <small>{{ p.text[:50] }}...</small>
                            </div>
                            <div>
                                <a href="{{ url_for('approve_pending', idx=loop.index0) }}" class="btn btn-success btn-sm">✅</a>
                                <a href="{{ url_for('reject_pending', idx=loop.index0) }}" class="btn btn-danger btn-sm">❌</a>
                            </div>
                        </li>
                        {% endfor %}
                    </ul>
                    {% else %}
                    <p>Нет активных заявок</p>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">📊 Быстрые ссылки</div>
                <div class="card-body">
                    <a href="/stats" class="btn btn-info w-100 mb-2" target="_blank">Статистика</a>
                    <a href="/pending" class="btn btn-warning w-100" target="_blank">Все заявки (история)</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>window.Telegram.WebApp.ready();</script>
</body>
</html>
